name: Scheduled Security & Dependency Checks

on:
  schedule:
    # Runs daily at 02:00 WIB (19:00 UTC)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency & SBOM Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: Lab-FrontEnd/package-lock.json

      - name: Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1

      - name: Install frontend dependencies
        working-directory: Lab-FrontEnd
        run: npm ci

      - name: Frontend dependency audit & SBOM
        working-directory: Lab-FrontEnd
        run: |
          npm sbom --sbom-format cyclonedx > ../frontend-sbom.json
          npm audit --json > ../frontend-npm-audit.json || true
          echo "### Frontend Outdated Packages" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm outdated >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high

      - name: Rust dependency audit & SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.7 --locked
          cargo cyclonedx --format json
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --json > rust-audit.json

      - name: Python security tooling audit
        run: |
          python3 -m venv /tmp/ifa-pip-audit
          /tmp/ifa-pip-audit/bin/pip install --upgrade pip pip-audit
          /tmp/ifa-pip-audit/bin/pip-audit -r security/requirements.txt -f json -o python-audit.json

      - name: Upload dependency audit artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scheduled-dependency-audit-${{ github.run_id }}
          path: |
            frontend-sbom.json
            frontend-npm-audit.json
            rust-audit.json
            python-audit.json
            **/bom.json
            **/*.cdx.json

  sast-and-secrets:
    name: SAST & Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep & detect-secrets
        run: |
          python3 -m venv /tmp/ifa-scanners
          /tmp/ifa-scanners/bin/pip install -r security/requirements.txt
          export PATH="/tmp/ifa-scanners/bin:$PATH"
          /tmp/ifa-scanners/bin/semgrep --test security
          /tmp/ifa-scanners/bin/semgrep scan --config security/semgrep.yml --error --json Lab-Backend/src Lab-FrontEnd/src > semgrep.json
          /tmp/ifa-scanners/bin/python scripts/scan-secrets.py secrets.json
          python3 scripts/check-secrets.py secrets.json

      - name: Upload SAST & secret scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scheduled-sast-secrets-${{ github.run_id }}
          path: |
            semgrep.json
            secrets.json

  container-and-fs-scan:
    name: Container & Lockfile Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Filesystem vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Validate Compose definitions
        env:
          POSTGRES_MIGRATOR_PASSWORD: ci-check-only # pragma: allowlist secret -- disposable CI fixture
        run: |
          docker compose --profile app config --quiet
          cp deploy/production.env.example deploy/production.env
          docker compose -f deploy/compose.prod.yaml config --quiet
          rm -f deploy/production.env

      - name: Build backend & frontend containers
        run: |
          docker build -t ifa-lab-backend:scheduled -f Lab-Backend/Dockerfile .
          docker build -t ifa-lab-frontend:scheduled -f Lab-FrontEnd/Dockerfile .

      - name: Verify non-root container users
        run: |
          test "$(docker inspect --format '{{.Config.User}}' ifa-lab-backend:scheduled)" = "10001:10001"
          test -n "$(docker inspect --format '{{.Config.User}}' ifa-lab-frontend:scheduled)"

      - name: Backend container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ifa-lab-backend:scheduled
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Frontend container vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ifa-lab-frontend:scheduled
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
