# Only the disposable CI runner; production uses deploy/nginx.conf with HTTPS.
pid WORKSPACE/reports/nginx.pid;
error_log WORKSPACE/reports/nginx-error.log crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server {
        listen 127.0.0.1:5173;
        server_name 127.0.0.1;
        root WORKSPACE/Lab-FrontEnd/dist;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location /api/ { proxy_pass http://127.0.0.1:3008; proxy_set_header Host 127.0.0.1; }
        location / { try_files $uri /index.html; }
    }
}
