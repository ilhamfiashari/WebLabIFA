# Include inside http {}. Log paths only: never OAuth query strings.
log_format ifa_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=ifa_login:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=ifa_api:1m rate=60r/s;

server {
    listen 80;
    server_name lab.ilhamfirmanashari.my.id;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://lab.ilhamfirmanashari.my.id$request_uri; }
    access_log /var/log/nginx/ifa-access.log ifa_safe;
}

server {
    listen 443 ssl;
    server_name lab.ilhamfirmanashari.my.id;
    ssl_certificate /etc/letsencrypt/live/lab.ilhamfirmanashari.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.ilhamfirmanashari.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ifa/current/Lab-FrontEnd/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/ifa-access.log ifa_safe;
    # Nginx error messages may include the original request; exclude callback errors.
    error_log /var/log/nginx/ifa-error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    location = /api/auth/google/start {
        limit_req zone=ifa_login burst=40 nodelay;
        include /etc/nginx/snippets/ifa-proxy.conf;
    }
    location = /api/auth/google/callback {
        error_log /dev/null;
        include /etc/nginx/snippets/ifa-proxy.conf;
    }
    location /api/ {
        limit_req zone=ifa_api burst=80 nodelay;
        include /etc/nginx/snippets/ifa-proxy.conf;
    }
    location /assets/ {
        expires 1d;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        # Repeat headers because add_header inheritance is replaced in this block.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. { deny all; }
}
